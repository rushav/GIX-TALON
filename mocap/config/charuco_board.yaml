# ChArUco calibration board geometry.
# Physical target: printed 9x6 chessboard with ArUco markers in the white squares.
# Nothing in the capture tool hardcodes these numbers.

dictionary: DICT_5X5_1000

squares_x: 9              # chessboard squares across
squares_y: 6              # chessboard squares down
square_length_mm: 90.0    # chessboard square edge
marker_length_mm: 67.0    # ArUco marker edge inside a white square

# (9*6)/2 = 27 white squares, so 27 markers, ids 0..26.
marker_count: 27

# OpenCV 5.x needs this to reproduce the board layout, even though the board was
# generated with calib.io's "ChArUco Legacy" checkbox UNCHECKED. Without it
# detectBoard returns zero corners on frames where detectMarkers finds 26 of 27
# markers. OpenCV 4.6, which the C++ side links, already uses the legacy layout
# and needs no flag. See mocap/docs/FINDINGS.md.
legacy_pattern: true
